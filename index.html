<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons (use the on-brand teal as the mask colour). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.png" color="#2EBFA5" />

    <!-- Crawler-visible defaults (per-route overrides happen client-side via useDocumentMeta).
         Lengths matter: Google ellipsises titles past ~60 chars and cuts descriptions
         past ~155. These are the strings the / route also applies at runtime
         (see siteRoutes in src/lib/site.ts) — keep the two in sync.
         Title 57 chars · description 136 chars. -->
    <title>Derren Winata — Full-Stack Developer &amp; Data Analyst (NUS)</title>
    <meta
      name="description"
      content="Derren Winata — full-stack developer and data analyst (NUS, Class of 2026). AI/LLM apps, data pipelines, shipped products. Open to work."
    />
    <meta name="author" content="Derren Winata" />
    <meta
      name="keywords"
      content="Derren Winata, NUS, Data Science, Analytics, AI, Full-Stack, Product Manager, Portfolio, Singapore, React, Next.js, Python, Supabase"
    />
    <meta name="theme-color" content="#0C0E12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="googlebot" content="index,follow" />

    <!-- Performance: preconnect to Google Fonts so the @import in CSS doesn't stall. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Static Open Graph. Absolute URLs on https://derren-winata.com (canonical
         origin is also re-asserted at runtime by useDocumentMeta). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Derren Winata" />
    <meta property="og:locale" content="en_SG" />
    <meta property="og:url" content="https://derren-winata.com/" />
    <meta property="og:title" content="Derren Winata — Full-Stack Developer &amp; Data Analyst (NUS)" />
    <meta
      property="og:description"
      content="NUS Data Science &amp; Analytics graduate (Class of 2026). 3 platforms shipped, 83% faster reporting, products live in production. Open to work."
    />
    <meta property="og:image" content="https://derren-winata.com/og/og-home.jpg" />
    <meta property="og:image:secure_url" content="https://derren-winata.com/og/og-home.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Derren Winata — I build systems that turn data into decisions." />

    <!-- Twitter card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Derren Winata — Full-Stack Developer &amp; Data Analyst (NUS)" />
    <meta
      name="twitter:description"
      content="NUS Data Science &amp; Analytics graduate (Class of 2026). Full-stack developer and data analyst. Open to work."
    />
    <meta name="twitter:image" content="https://derren-winata.com/og/og-home.jpg" />
    <meta name="twitter:image:alt" content="Derren Winata — I build systems that turn data into decisions." />

    <link rel="canonical" href="https://derren-winata.com/" />

    <!-- Structured data: Person + ProfilePage, only verified facts.
         Notes:
         - `seeks` is NOT a valid schema.org property — deliberately omitted.
         - `nationality` omitted: schema.org expects a Country node, and it
           isn't a fact the portfolio data actually asserts.
         - `sameAs` lists verified third-party profile URLs only — the
           x.com/@derren_winata handle is unverified, so it is excluded here
           for the same reason `twitter:site` was dropped.
         - `knowsAbout` lists technologies verified in the portfolio data.
         - `alumniOf` references NUS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://derren-winata.com/#person",
            "name": "Derren Winata",
            "givenName": "Derren",
            "familyName": "Winata",
            "url": "https://derren-winata.com/",
            "image": "https://derren-winata.com/images/profile-picture.jpeg",
            "email": "mailto:wderren17@gmail.com",
            "telephone": "+65-8355-3698",
            "jobTitle": "Full-Stack Developer & Data Analyst",
            "description": "National University of Singapore (NUS) Data Science & Analytics graduate, Class of 2026, building data products, AI systems, and full-stack software.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Singapore",
              "addressCountry": "SG"
            },
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "National University of Singapore",
              "sameAs": "https://www.nus.edu.sg/"
            },
            "knowsAbout": [
              "Data Science",
              "Analytics",
              "Artificial Intelligence",
              "Large Language Models",
              "Full-Stack Development",
              "React",
              "TypeScript",
              "Python",
              "PostgreSQL",
              "Snowflake",
              "Apache Airflow",
              "Apache Kafka",
              "Next.js",
              "Supabase",
              "Product Management"
            ],
            "sameAs": [
              "https://github.com/darderrdur17",
              "https://linkedin.com/in/derren-winata"
            ]
          },
          {
            "@type": "ProfilePage",
            "@id": "https://derren-winata.com/#profilepage",
            "url": "https://derren-winata.com/",
            "name": "Derren Winata — Portfolio",
            "isPartOf": { "@id": "https://derren-winata.com/#website" },
            "about": { "@id": "https://derren-winata.com/#person" },
            "inLanguage": "en"
          },
          {
            "@type": "WebSite",
            "@id": "https://derren-winata.com/#website",
            "url": "https://derren-winata.com/",
            "name": "Derren Winata",
            "publisher": { "@id": "https://derren-winata.com/#person" },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <!-- iOS smart-app-bar tint. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  </head>

  <body>
    <div id="root"></div>

    <!-- Crawler-visible summary for non-JS visitors. Must live in <body>: a
         <noscript> in <head> may only contain link/style/meta. -->
    <noscript>
      <div
        style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: Inter, system-ui, sans-serif; line-height: 1.6; color: #0c0e12; background: #f7f8fa"
      >
        <h1>Derren Winata — Full-Stack Developer &amp; Data Analyst</h1>
        <p>
          National University of Singapore (NUS) Data Science &amp; Analytics
          graduate, Class of 2026. I build AI/LLM applications, data pipelines,
          and full-stack products — including a live cognitive-health platform
          at 360cogni.com and a health-economics research tool used in four
          languages. Based in Singapore and open to full-time roles and
          freelance projects.
        </p>
        <p>
          This portfolio needs JavaScript enabled to display. You can still
          reach Derren at
          <a href="mailto:wderren17@gmail.com" style="color: #2ebfa5"
            >wderren17@gmail.com</a
          >, on
          <a href="https://www.linkedin.com/in/derren-winata" style="color: #2ebfa5"
            >LinkedIn</a
          >, or on
          <a href="https://github.com/darderrdur17" style="color: #2ebfa5">GitHub</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
